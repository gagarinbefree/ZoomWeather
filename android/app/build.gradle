apply plugin: 'com.android.application'

def isFdroid = project.findProperty('fdroid') == 'true'

def generatedSharedIcon = file("$buildDir/generated/shared-icon")
def appVersionCode = (project.findProperty('appVersionCode') ?: '1').toString().toInteger()
def appVersionName = (project.findProperty('appVersionName') ?: '0.1.0').toString()
def signingStorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def signingStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def generateSharedIcon = tasks.register('generateSharedIcon', Copy) {
    from("$rootDir/../shared/assets/branding/app-icon-512.png")
    into(file("$generatedSharedIcon/drawable-nodpi"))
    rename 'app-icon-512.png', 'zoomweather_icon.png'
}

android {
    namespace = "com.gagarinbefree.zoomweather"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures { buildConfig true }
    defaultConfig {
        // Keep the installed package identity so existing Android apps can update.
        applicationId "com.gagarinbefree.tikweather"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        buildConfigField "boolean", "FDROID", isFdroid.toString()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signingStorePath && signingStorePassword) {
                storeFile file(signingStorePath)
                storePassword signingStorePassword
                // Read the existing signing key without changing repository secrets.
                def signingStore = java.security.KeyStore.getInstance(file(signingStorePath), signingStorePassword.toCharArray())
                def keyAliases = signingStore.aliases().toList().findAll { signingStore.isKeyEntry(it) }
                if (keyAliases.size() != 1) {
                    throw new GradleException('The Android signing store must contain exactly one private key')
                }
                keyAlias keyAliases.first()
                keyPassword signingStorePassword
            }
        }
    }
    buildTypes {
        debug {
            if (isFdroid) {
                applicationIdSuffix '.fdroid'
                versionNameSuffix '-fdroid-debug'
            }
        }
        release {
            if (signingStorePath && signingStorePassword) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets {
        main.res.srcDir generatedSharedIcon
        test.java.srcDir "../../src/tests/app/platforms/android/native"
    }
}

tasks.named('preBuild').configure {
    dependsOn generateSharedIcon
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'


if (isFdroid) {
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group.startsWith('com.google.android.gms') ||
                    details.requested.group.startsWith('com.google.firebase') ||
                    details.requested.group == 'io.ionic.libs') {
                throw new GradleException('F Droid must not include Google Play Services or the proprietary geolocation backend')
            }
        }
    }
}
