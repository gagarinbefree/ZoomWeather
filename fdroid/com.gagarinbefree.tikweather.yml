Builds:
  - versionName: 0.1.58
    versionCode: 58
    commit: 68818762b8d6f6359742e862ea62a7caf2e15be0
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless curl xz-utils
    init:
      - cd ../..
      - curl -Lo node.tar.xz https://nodejs.org/dist/v24.15.0/node-v24.15.0-linux-x64.tar.xz
      - echo '472655581fb851559730c48763e0c9d3bc25975c59d518003fc0849d3e4ba0f6  node.tar.xz' | sha256sum -c -
      - tar xf node.tar.xz
      - rm node.tar.xz
    prebuild:
      - cd ../..
      - export PATH="$PWD/node-v24.15.0-linux-x64/bin:$PATH"
      - npm ci
      - echo 'appVersionCode=$$VERCODE$$' >> android/gradle.properties
      - echo 'appVersionName=$$VERSION$$' >> android/gradle.properties
      - ZOOMWEATHER_DISTRIBUTION=fdroid node node_modules/@capacitor/cli/bin/capacitor update android
      - rm -rf node_modules/@capacitor/geolocation node_modules/@capacitor/synapse
    rm:
      - src/app/main.android.ts
    scanignore:
      - node-v24.15.0-linux-x64/bin/node
      - node_modules/@rolldown/binding-linux-x64-gnu
      - node_modules/@rollup/rollup-linux-x64-gnu
      - node_modules/@parcel/watcher-linux-x64-glibc
      - node_modules/lightningcss-linux-x64-gnu
      - node_modules/@one-ini/wasm/one_ini_bg.wasm
      - node_modules/source-map/lib/mappings.wasm
    scandelete:
      - node_modules/playwright-core/lib/webp_codec.wasm
    build:
      - cd ../..
      - export PATH="$PWD/node-v24.15.0-linux-x64/bin:$PATH"
      - export VITE_APP_VERSION=$$VERSION$$
      - npm run android:sync:fdroid
    gradle:
      - yes
    gradleprops:
      - fdroid=true
AutoUpdateMode: Version
UpdateCheckMode: Tags ^v0\.1\.[0-9]+$
